# NanoK3 (Track B) — native gate workflow, 6-target hosted-runner matrix.
# Proves macOS / Linux / Windows parity (x64 + ARM64) on the same gate the
# Windows leg has always run: gate-fmt, gate-lint, gate-test, gate-deny
# (advisory). Live tests never run in CI (they need the owner-held Flux
# credential); evidence fixtures replay instead.
#
# POST-PORT STATE: the unix legs (macos-*, ubuntu-*) assume the in-flight
# nano-sandbox unix backend port has landed — including the
# `nanok3-linux-sandbox` helper binary built on the Linux legs below. Until
# that port merges, expect the unix legs to fail in gate-lint/gate-test; the
# matrix is authored for the tree after the port. fail-fast is off so one
# red leg never cancels the others.

name: nanok3-gate

on:
  push:
    branches: [master]
  pull_request:

jobs:
  gate:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            arch: x64
          - os: windows-11-arm
            arch: arm64
          - os: macos-14
            arch: arm64
          - os: macos-15-intel
            arch: x64
          - os: ubuntu-22.04
            arch: x64
          - os: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (pinned)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"

      - name: Install just
        uses: taiki-e/install-action@just

      - name: Install cargo-deny
        uses: taiki-e/install-action@cargo-deny

      - name: gate-fmt
        run: just gate-fmt

      - name: gate-lint
        run: just gate-lint

      - name: gate-test
        run: just gate-test

      # cargo build --workspace builds every workspace bin; on unix this is
      # what compiles the ported sandbox helpers (nanok3-linux-sandbox and
      # any macOS seatbelt helper) that gate-test alone may not exercise.
      - name: Build workspace binaries (unix sandbox helpers)
        if: runner.os != 'Windows'
        run: cargo build --workspace --bins

      # Post-port proof: the Linux sandbox helper binary must exist.
      - name: Verify nanok3-linux-sandbox helper built
        if: runner.os == 'Linux'
        run: test -x target/debug/nanok3-linux-sandbox

      - name: gate-deny
        run: just gate-deny
        continue-on-error: true # advisory until SBOM policy lands

      - name: Evidence manifest (Windows)
        if: always() && runner.os == 'Windows'
        shell: pwsh
        run: |
          $manifest = [ordered]@{
            gate = "ci-${{ matrix.os }}"
            sha = "${{ github.sha }}"
            runner = $env:COMPUTERNAME
            os = "${{ matrix.os }}"
            arch = "${{ matrix.arch }}"
            rust = "1.95.0"
            at = (Get-Date).ToUniversalTime().ToString("o")
            steps = @("gate-fmt", "gate-lint", "gate-test", "gate-deny(advisory)")
          }
          New-Item -ItemType Directory -Force -Path nano-k3/artifacts/evidence/ci | Out-Null
          $manifest | ConvertTo-Json | Out-File "nano-k3/artifacts/evidence/ci/$($env:GITHUB_RUN_ID)-manifest.json" -Encoding utf8

      - name: Evidence manifest (unix)
        if: always() && runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p nano-k3/artifacts/evidence/ci
          cat > "nano-k3/artifacts/evidence/ci/${GITHUB_RUN_ID}-manifest.json" <<JSON
          {
            "gate": "ci-${{ matrix.os }}",
            "sha": "${{ github.sha }}",
            "runner": "$(hostname)",
            "os": "${{ matrix.os }}",
            "arch": "${{ matrix.arch }}",
            "rust": "1.95.0",
            "at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "steps": ["gate-fmt", "gate-lint", "gate-test", "build-bins", "gate-deny(advisory)"]
          }
          JSON

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-manifest-${{ matrix.os }}
          path: nano-k3/artifacts/evidence/ci/
