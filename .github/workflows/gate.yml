# Wayland Nano (Track B) — native gate workflow, 6-target hosted-runner matrix.
# Proves macOS / Linux / Windows parity (x64 + ARM64) on the same gate the
# Windows leg has always run: gate-fmt, gate-lint, gate-test, gate-deny
# (hard gate — licenses/advisories/bans fail the build). A CycloneDX SBOM is
# generated on the windows-latest leg (output is platform-independent, so one
# leg suffices) and lands in that leg's evidence artifacts. Live tests never
# run in CI (they need the owner-held Flux credential); evidence fixtures
# replay instead.
#
# POST-PORT STATE: the unix legs (macos-*, ubuntu-*) assume the in-flight
# nano-sandbox unix backend port has landed — including the
# `wayland-nano-linux-sandbox` helper binary built on the Linux legs below.
# Until that port merges, expect the unix legs to fail in gate-lint/gate-test;
# the matrix is authored for the tree after the port. fail-fast is off so one
# red leg never cancels the others.

name: wayland-nano-gate

on:
  push:
    branches: [master]
  pull_request:

jobs:
  gate:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            arch: x64
          - os: windows-11-arm
            arch: arm64
          - os: macos-14
            arch: arm64
          - os: macos-15-intel
            arch: x64
          - os: ubuntu-22.04
            arch: x64
          - os: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (pinned)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"
          # The repo's rust-toolchain.toml omits components, so the action's
          # minimal profile wins; spell out what the gate needs.
          components: rustfmt, clippy

      - name: Install just
        uses: taiki-e/install-action@just

      - name: Install cargo-deny
        uses: taiki-e/install-action@cargo-deny

      - name: gate-fmt
        run: just gate-fmt

      - name: gate-lint
        run: just gate-lint

      # Build all bins BEFORE the tests: the unix shell-tool runtime tests
      # exec the wayland-nano-linux-sandbox helper, and `cargo test` only builds
      # bins of the package under test — the helper must already exist in
      # target/debug/.
      - name: Build workspace binaries (unix sandbox helpers)
        if: runner.os != 'Windows'
        run: cargo build --workspace --bins

      # Post-port proof: the Linux sandbox helper binary must exist.
      - name: Verify wayland-nano-linux-sandbox helper built
        if: runner.os == 'Linux'
        run: test -x target/debug/wayland-nano-linux-sandbox

      # The helper's modern path shells out to bubblewrap; hosted Ubuntu
      # images don't ship it. (Legacy landlock fallback stays tested by the
      # builder tests; runtime tests exercise the default bwrap path.)
      # Ubuntu 24.04+ restricts unprivileged user namespaces via AppArmor
      # (bwrap dies with "loopback: Failed RTM_NEWADDR: Operation not
      # permitted" on 24.04-arm); the sandbox REQUIRES userns+netns, so
      # lift the host restriction on the throwaway runner.
      - name: Install bubblewrap (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y bubblewrap
          sudo sysctl kernel.apparmor_restrict_unprivileged_userns=0 || true
          sudo sysctl kernel.unprivileged_userns_clone=1 || true

      - name: gate-test
        run: just gate-test

      # C2.4 oracle is "CI measurement": run the agent-path profiler in
      # release mode and emit a machine-readable report, merged into this
      # leg's evidence manifest below. Advisory — perf never fails the gate.
      - name: gate-perf (C2.4, advisory)
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: |
          cargo build --release -p nano-cli
          New-Item -ItemType Directory -Force -Path artifacts/evidence/ci | Out-Null
          ./target/release/wayland-nano-acp-profile.exe --json artifacts/evidence/ci/perf-${{ matrix.os }}.json

      - name: gate-deny
        run: just gate-deny

      # SBOM is gated to the windows-latest leg: cargo-cyclonedx derives the
      # dependency closure from Cargo.lock + cargo metadata, so the output is
      # platform-independent and one leg suffices (avoids 6x toolchain fetch).
      # cargo-cyclonedx writes <override-filename>.json adjacent to every
      # workspace member's Cargo.toml; we keep the nano-cli one (the shipped
      # binary crate) as the canonical sbom.json and clean up the rest.
      - name: Install cargo-cyclonedx
        if: matrix.os == 'windows-latest'
        uses: taiki-e/install-action@cargo-cyclonedx

      - name: CycloneDX SBOM (sbom.json)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          cargo cyclonedx --manifest-path crates/nano-cli/Cargo.toml --format json --all --override-filename sbom
          New-Item -ItemType Directory -Force -Path artifacts/evidence/ci | Out-Null
          Move-Item -Force crates/nano-cli/sbom.json artifacts/evidence/ci/sbom.json
          Remove-Item -Force crates/*/sbom.json

      - name: Evidence manifest (Windows)
        if: always() && runner.os == 'Windows'
        shell: pwsh
        run: |
          $manifest = [ordered]@{
            gate = "ci-${{ matrix.os }}"
            sha = "${{ github.sha }}"
            runner = $env:COMPUTERNAME
            os = "${{ matrix.os }}"
            arch = "${{ matrix.arch }}"
            rust = "1.95.0"
            at = (Get-Date).ToUniversalTime().ToString("o")
            steps = @("gate-fmt", "gate-lint", "gate-test", "gate-deny")
          }
          $perfPath = "artifacts/evidence/ci/perf-${{ matrix.os }}.json"
          if (Test-Path $perfPath) {
            $manifest.steps += "gate-perf(advisory)"
            $manifest.perf = Get-Content $perfPath -Raw | ConvertFrom-Json
          }
          if (Test-Path "artifacts/evidence/ci/sbom.json") {
            $manifest.steps += "sbom(cyclonedx)"
          }
          New-Item -ItemType Directory -Force -Path artifacts/evidence/ci | Out-Null
          $manifest | ConvertTo-Json | Out-File "artifacts/evidence/ci/$($env:GITHUB_RUN_ID)-manifest.json" -Encoding utf8

      - name: Evidence manifest (unix)
        if: always() && runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p artifacts/evidence/ci
          cat > "artifacts/evidence/ci/${GITHUB_RUN_ID}-manifest.json" <<JSON
          {
            "gate": "ci-${{ matrix.os }}",
            "sha": "${{ github.sha }}",
            "runner": "$(hostname)",
            "os": "${{ matrix.os }}",
            "arch": "${{ matrix.arch }}",
            "rust": "1.95.0",
            "at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "steps": ["gate-fmt", "gate-lint", "gate-test", "build-bins", "gate-deny"]
          }
          JSON

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-manifest-${{ matrix.os }}
          path: artifacts/evidence/ci/
