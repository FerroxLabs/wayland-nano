          $binaryHash=(Get-FileHash -LiteralPath $binary -Algorithm SHA256).Hash
          function Invoke-ProtectedGate($gateId){
            if(!(Test-Path -LiteralPath $protectedDir -PathType Container)-or!(Test-Path -LiteralPath $binary -PathType Leaf)-or(Get-Item -LiteralPath $binary).FullName-ne'F:\gate-cards-bin\wayland-nano.exe'-or(Get-FileHash -LiteralPath $binary -Algorithm SHA256).Hash-ne$binaryHash){throw 'protected identity changed before gate'}
            try{$exit=[GateCardsRestrictedProcess]::RunGate($gateId)}finally{
              if($gateId-eq'install-payload'-and(Test-Path -LiteralPath $scratchRoot)){
                $fullScratch=[IO.Path]::GetFullPath($scratchRoot);$tempPrefix=[IO.Path]::GetFullPath('F:\tmp').TrimEnd('\')+'\'
                if($fullScratch-ne'F:\tmp\wp4-install-gate'-or!$fullScratch.StartsWith($tempPrefix,[StringComparison]::OrdinalIgnoreCase)-or((Get-Item -LiteralPath $fullScratch).Attributes-band[IO.FileAttributes]::ReparsePoint)){throw 'unsafe install scratch cleanup'}
                Remove-Item -LiteralPath $fullScratch -Recurse -Force
                if(Test-Path -LiteralPath $fullScratch){throw 'install scratch cleanup failed'}
              }
            }
            if(!(Test-Path -LiteralPath $protectedDir -PathType Container)-or!(Test-Path -LiteralPath $binary -PathType Leaf)-or(Get-Item -LiteralPath $binary).FullName-ne'F:\gate-cards-bin\wayland-nano.exe'-or(Get-FileHash -LiteralPath $binary -Algorithm SHA256).Hash-ne$binaryHash){throw 'protected identity changed after gate'}
            return $exit
          }
          # Exact landed WP-3 contract: verify --gate "$gate_id" --run-only
          foreach($gate_id in $gateIds){$exit=Invoke-ProtectedGate $gate_id;if($exit-ne 0){throw "good gate blocked: $gate_id (exit $exit)"}}
          Copy-Item -Force packaging/npm/binaries/win32-x64/wayland-nano.exe packaging/npm/binaries/linux-x64/wayland-nano
          $badExit=Invoke-ProtectedGate 'install-payload'
          if($badExit-ne 3){throw 'ip-m1 did not block with exit 3'}

      - name: Require clean producer tree
        if: always()
        shell: pwsh
        working-directory: F:\repo
        run: |
          Remove-Item -Recurse -Force packaging/npm/binaries -ErrorAction SilentlyContinue
          Remove-Item -Force packaging/npm/binaries-manifest.json -ErrorAction SilentlyContinue
          $status=git status --short -- packaging/npm
          if($LASTEXITCODE-ne 0-or$status){throw "producer residue: $status"}

      - name: Remove owned worktree and F volume
        if: always()
        shell: pwsh
        run: |
          $failed=$false
          $scratchRoot=[IO.Path]::GetFullPath('F:\tmp\wp4-install-gate');$tempPrefix=[IO.Path]::GetFullPath('F:\tmp').TrimEnd('\')+'\'
          if($scratchRoot-ne'F:\tmp\wp4-install-gate'-or!$scratchRoot.StartsWith($tempPrefix,[StringComparison]::OrdinalIgnoreCase)){throw 'scratch cleanup path drift'}
          if(Test-Path -LiteralPath $scratchRoot){if((Get-Item -LiteralPath $scratchRoot).Attributes-band[IO.FileAttributes]::ReparsePoint){throw 'scratch cleanup reparse point'};Remove-Item -LiteralPath $scratchRoot -Recurse -Force}
          if(Test-Path -LiteralPath $scratchRoot){$failed=$true}
          foreach($probe in @('F:\restricted-probe','F:\gate-cards-bin-moved')){if(Test-Path -LiteralPath $probe){Remove-Item -LiteralPath $probe -Recurse -Force};if(Test-Path -LiteralPath $probe){$failed=$true}}
          $protectedDir=[IO.Path]::GetFullPath('F:\gate-cards-bin')
          if($protectedDir-ne'F:\gate-cards-bin'){throw 'protected cleanup path drift'}
          if(Test-Path -LiteralPath $protectedDir){Remove-Item -LiteralPath $protectedDir -Recurse -Force}
          if(Test-Path -LiteralPath $protectedDir){$failed=$true}
          if($env:WN_GC_WT_OWNED-eq'1'){git worktree remove --force F:\repo;if($LASTEXITCODE-ne 0){$failed=$true};git worktree prune;if($LASTEXITCODE-ne 0){$failed=$true};if((git worktree list --porcelain)-match'(?im)^worktree F:[/\\]repo$'){$failed=$true}}
          if($env:WN_GC_VHD_OWNED-eq'1'){
            $root=[IO.Path]::GetFullPath($env:RUNNER_TEMP).TrimEnd('\')+'\';$vhd=[IO.Path]::GetFullPath($env:WN_GC_VHD);$leaf=Split-Path -Leaf $vhd
            if(!$vhd.StartsWith($root,[StringComparison]::OrdinalIgnoreCase)-or$leaf-notmatch'^wayland-nano-gate-cards-[0-9a-f]{32}\.vhdx$'){throw 'unowned cleanup path'}
            $script=Join-Path $env:RUNNER_TEMP "gate-cards-cleanup-$([Guid]::NewGuid().ToString('N')).txt"
            try {
              @("select vdisk file=`"$vhd`"",'detach vdisk') | Set-Content $script -Encoding ascii
              & diskpart.exe /s $script
              if($LASTEXITCODE-ne 0){$failed=$true}
              $image=Get-DiskImage $vhd -ErrorAction SilentlyContinue
              if($image-and$image.Attached){$failed=$true}elseif(Test-Path $vhd){Remove-Item $vhd -Force}
              if(Test-Path $vhd){$failed=$true}
            } finally { Remove-Item $script -Force -ErrorAction SilentlyContinue }
          }
          if($failed){throw 'owned cleanup failed'}
