# Wayland Nano (Track B) — native gate workflow, 6-target hosted-runner matrix.
# Proves macOS / Linux / Windows parity (x64 + ARM64) on the same gate the
# Windows leg has always run: gate-fmt, gate-lint, gate-test, gate-gen-check,
# gate-deny
# (hard gate — licenses/advisories/bans fail the build). A CycloneDX SBOM is
# generated on the windows-latest leg (output is platform-independent, so one
# leg suffices) and lands in that leg's evidence artifacts. Live tests never
# run in CI (they need the owner-held Flux credential); evidence fixtures
# replay instead.
#
# POST-PORT STATE: the unix legs (macos-*, ubuntu-*) assume the in-flight
# nano-sandbox unix backend port has landed — including the
# `wayland-nano-linux-sandbox` helper binary built on the Linux legs below.
# Until that port merges, expect the unix legs to fail in gate-lint/gate-test;
# the matrix is authored for the tree after the port. fail-fast is off so one
# red leg never cancels the others.

name: wayland-nano-gate

on:
  push:
    branches: [master]
  pull_request:

jobs:
  gate:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            arch: x64
          - os: windows-11-arm
            arch: arm64
          - os: macos-14
            arch: arm64
          - os: macos-15-intel
            arch: x64
          - os: ubuntu-22.04
            arch: x64
          - os: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (pinned)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"
          # The repo's rust-toolchain.toml omits components, so the action's
          # minimal profile wins; spell out what the gate needs.
          components: rustfmt, clippy

      - name: Install just
        uses: taiki-e/install-action@just

      - name: Install cargo-deny
        uses: taiki-e/install-action@cargo-deny

      # The verifier's process-isolation contract requires TEMP and TMP to
      # name the same canonical directory. Give it a real NTFS F: volume so
      # volume-identity checks see a distinct filesystem (subst is only a path
      # alias). Do not replace runner-wide TEMP/TMP used by unrelated tests.
      - name: Configure verifier temp directory (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if ((Get-PSDrive -Name F -ErrorAction SilentlyContinue) -or (Test-Path -LiteralPath "F:\")) {
            throw "F: is already in use; refusing to replace an existing drive"
          }

          $runToken = [Guid]::NewGuid().ToString("N")
          $vhdPath = Join-Path $env:RUNNER_TEMP "wayland-nano-verifier-$runToken.vhdx"
          $setupScript = Join-Path $env:RUNNER_TEMP "wayland-nano-vhd-setup-$runToken.txt"
          $detachScript = Join-Path $env:RUNNER_TEMP "wayland-nano-vhd-detach-$runToken.txt"
          $diskpartSetup = @(
            "create vdisk file=`"$vhdPath`" maximum=8192 type=expandable"
            "select vdisk file=`"$vhdPath`""
            "attach vdisk"
            "create partition primary"
            "format fs=ntfs quick label=WNVERIFY"
            "assign letter=F"
          )

          try {
            $diskpartSetup | Set-Content -LiteralPath $setupScript -Encoding ascii
            & diskpart.exe /s $setupScript
            if ($LASTEXITCODE -ne 0) {
              throw "diskpart failed while creating the verifier volume"
            }
            $volume = Get-Volume -DriveLetter F -ErrorAction Stop
            if ($volume.FileSystem -ne "NTFS" -or $volume.FileSystemLabel -ne "WNVERIFY") {
              throw "F: is not the owned NTFS verifier volume"
            }

            # Persist ownership immediately after attach/assign. Later cleanup
            # is forbidden from touching any VHD or drive not named here.
            "WN_TEMP_VHD_PATH=$vhdPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            "WN_TEMP_VHD_OWNED=1" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            $verifierTemp = "F:\tmp"
            New-Item -ItemType Directory -Force -Path $verifierTemp | Out-Null
            if (-not (Test-Path -LiteralPath $verifierTemp -PathType Container)) {
              throw "failed to create the verifier temp child directory"
            }
            "WN_VERIFY_TEMP=$verifierTemp" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          } catch {
            # A failed diskpart script can leave a partially attached image.
            # Select only this run's unique image and detach it if present.
            if (Test-Path -LiteralPath $vhdPath) {
              @(
                "select vdisk file=`"$vhdPath`""
                "detach vdisk"
              ) | Set-Content -LiteralPath $detachScript -Encoding ascii
              & diskpart.exe /s $detachScript | Out-Null
              if (-not (Get-DiskImage -ImagePath $vhdPath -ErrorAction SilentlyContinue).Attached) {
                Remove-Item -LiteralPath $vhdPath -Force -ErrorAction SilentlyContinue
              }
            }
            throw
          } finally {
            Remove-Item -LiteralPath $setupScript, $detachScript -Force -ErrorAction SilentlyContinue
          }

      - name: Configure verifier temp directory (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          verifier_temp="${RUNNER_TEMP}/wayland-nano-verifier"
          mkdir -p "$verifier_temp"
          echo "TEMP=$verifier_temp" >> "$GITHUB_ENV"
          echo "TMP=$verifier_temp" >> "$GITHUB_ENV"
          echo "TMPDIR=$verifier_temp" >> "$GITHUB_ENV"

      - name: gate-fmt
        run: just gate-fmt

      - name: gate-lint
        run: just gate-lint

      # Build all bins BEFORE the tests: the unix shell-tool runtime tests
      # exec the wayland-nano-linux-sandbox helper, and `cargo test` only builds
      # bins of the package under test — the helper must already exist in
      # target/debug/.
      - name: Build workspace binaries (unix sandbox helpers)
        if: runner.os != 'Windows'
        run: cargo build --workspace --bins

      # Post-port proof: the Linux sandbox helper binary must exist.
      - name: Verify wayland-nano-linux-sandbox helper built
        if: runner.os == 'Linux'
        run: test -x target/debug/wayland-nano-linux-sandbox

      # P4 PTY: the unix PTY host-death sentinel must prebuild too — the
      # unix pty tests exec it via the beside-current_exe resolution.
      - name: Verify wayland-nano-pty-guard helper built
        if: runner.os != 'Windows'
        run: test -x target/debug/wayland-nano-pty-guard

      # The helper's modern path shells out to bubblewrap; hosted Ubuntu
      # images don't ship it. (Legacy landlock fallback stays tested by the
      # builder tests; runtime tests exercise the default bwrap path.)
      # Ubuntu 24.04+ restricts unprivileged user namespaces via AppArmor
      # (bwrap dies with "loopback: Failed RTM_NEWADDR: Operation not
      # permitted" on 24.04-arm); the sandbox REQUIRES userns+netns, so
      # lift the host restriction on the throwaway runner.
      - name: Install bubblewrap (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y bubblewrap
          sudo sysctl kernel.apparmor_restrict_unprivileged_userns=0 || true
          sudo sysctl kernel.unprivileged_userns_clone=1 || true

      - name: gate-test
        if: runner.os != 'Windows'
        run: just gate-test

      # Keep unrelated Windows tests on the hosted runner's native TEMP/TMP.
      # The 14 verifier integration tests are selected out by their complete,
      # exact source names here, then run once below under the scoped short
      # verifier temp path.
      - name: gate-test (Windows workspace)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $verifierTests = @(
            "verify_authored_defect_red_identifiers_only"
            "verify_receipt_roundtrip_valid"
            "verify_receipt_tampered_fails_closed"
            "verify_receipt_fabricated_commit"
            "verify_receipt_unknown_field_fails_closed"
            "verify_receipt_green_only_is_never_red"
            "verify_receipt_gate_pin_drift"
            "verify_exit_code_matrix"
            "verify_red_run_writes_no_receipt"
            "verify_receipt_ancestry_unproven"
            "verify_receipt_rerun_red_is_gate_mismatch"
            "verify_run_only_resolves_artifact_and_exit_codes"
            "verify_full_flow_green_mints_receipt"
            "fixture_materializes_real_history_and_resolves_templates"
          )
          $listOutput = & cargo test -p nano-cli --test verify_cmd -- --list 2>&1
          if ($LASTEXITCODE -ne 0) {
            $listOutput | Write-Output
            throw "failed to enumerate verify_cmd tests"
          }
          $declared = @($listOutput | ForEach-Object {
            if ($_ -match '^([^:]+): test$') { $Matches[1] }
          })
          $uniqueDeclared = @($declared | Sort-Object -Unique)
          if ($declared.Count -ne 14 -or $uniqueDeclared.Count -ne 14) {
            throw "verify_cmd must contain exactly 14 unique tests; found $($declared.Count) entries and $($uniqueDeclared.Count) unique names"
          }
          $declaredInventory = $uniqueDeclared -join "`n"
          $expectedInventory = ($verifierTests | Sort-Object) -join "`n"
          if ($declaredInventory -ne $expectedInventory) {
            throw "verify_cmd test inventory drifted; update the scoped Windows gate explicitly"
          }
          $cargoArgs = @("test", "--workspace", "--")
          foreach ($test in $verifierTests) {
            $cargoArgs += @("--skip", $test)
          }
          & cargo @cargoArgs
          if ($LASTEXITCODE -ne 0) {
            throw "Windows workspace tests failed"
          }

      - name: gate-test (Windows verifier scoped temp)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not $env:WN_VERIFY_TEMP) {
            throw "WN_VERIFY_TEMP was not configured"
          }
          $env:TEMP = $env:WN_VERIFY_TEMP
          $env:TMP = $env:WN_VERIFY_TEMP
          cargo test -p nano-cli --test verify_cmd -- --test-threads=1
          if ($LASTEXITCODE -ne 0) {
            throw "Windows verifier integration tests failed"
          }

      - name: gate-gen-check
        run: just gate-gen-check

      # C2.4 oracle is "CI measurement": run the agent-path profiler in
      # release mode and emit a machine-readable report, merged into this
      # leg's evidence manifest below. Advisory — perf never fails the gate.
      - name: gate-perf (C2.4, advisory)
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: |
          cargo build --release -p nano-cli
          New-Item -ItemType Directory -Force -Path artifacts/evidence/ci | Out-Null
          ./target/release/wayland-nano-acp-profile.exe --json artifacts/evidence/ci/perf-${{ matrix.os }}.json

      - name: gate-deny
        run: just gate-deny

      # SBOM is gated to the windows-latest leg: cargo-cyclonedx derives the
      # dependency closure from Cargo.lock + cargo metadata, so the output is
      # platform-independent and one leg suffices (avoids 6x toolchain fetch).
      # cargo-cyclonedx writes <override-filename>.json adjacent to every
      # workspace member's Cargo.toml; we keep the nano-cli one (the shipped
      # binary crate) as the canonical sbom.json and clean up the rest.
      - name: Install cargo-cyclonedx
        if: matrix.os == 'windows-latest'
        uses: taiki-e/install-action@cargo-cyclonedx

      - name: CycloneDX SBOM (sbom.json)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          cargo cyclonedx --manifest-path crates/nano-cli/Cargo.toml --format json --all --override-filename sbom
          New-Item -ItemType Directory -Force -Path artifacts/evidence/ci | Out-Null
          Move-Item -Force crates/nano-cli/sbom.json artifacts/evidence/ci/sbom.json
          Remove-Item -Force crates/*/sbom.json

      - name: Evidence manifest (Windows)
        if: always() && runner.os == 'Windows'
        shell: pwsh
        run: |
          $manifest = [ordered]@{
            gate = "ci-${{ matrix.os }}"
            sha = "${{ github.sha }}"
            runner = $env:COMPUTERNAME
            os = "${{ matrix.os }}"
            arch = "${{ matrix.arch }}"
            rust = "1.95.0"
            at = (Get-Date).ToUniversalTime().ToString("o")
            steps = @("gate-fmt", "gate-lint", "gate-test", "gate-gen-check", "gate-deny")
          }
          $perfPath = "artifacts/evidence/ci/perf-${{ matrix.os }}.json"
          if (Test-Path $perfPath) {
            $manifest.steps += "gate-perf(advisory)"
            $manifest.perf = Get-Content $perfPath -Raw | ConvertFrom-Json
          }
          if (Test-Path "artifacts/evidence/ci/sbom.json") {
            $manifest.steps += "sbom(cyclonedx)"
          }
          New-Item -ItemType Directory -Force -Path artifacts/evidence/ci | Out-Null
          $manifest | ConvertTo-Json | Out-File "artifacts/evidence/ci/$($env:GITHUB_RUN_ID)-manifest.json" -Encoding utf8

      - name: Evidence manifest (unix)
        if: always() && runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p artifacts/evidence/ci
          cat > "artifacts/evidence/ci/${GITHUB_RUN_ID}-manifest.json" <<JSON
          {
            "gate": "ci-${{ matrix.os }}",
            "sha": "${{ github.sha }}",
            "runner": "$(hostname)",
            "os": "${{ matrix.os }}",
            "arch": "${{ matrix.arch }}",
            "rust": "1.95.0",
            "at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "steps": ["gate-fmt", "gate-lint", "gate-test", "gate-gen-check", "build-bins", "gate-deny"]
          }
          JSON

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-manifest-${{ matrix.os }}
          path: artifacts/evidence/ci/

      - name: Remove verifier temp volume (Windows)
        if: always() && runner.os == 'Windows' && env.WN_TEMP_VHD_OWNED == '1'
        shell: pwsh
        run: |
          $vhdPath = $env:WN_TEMP_VHD_PATH
          $runnerTemp = [IO.Path]::GetFullPath($env:RUNNER_TEMP).TrimEnd('\') + '\'
          if ([string]::IsNullOrWhiteSpace($vhdPath)) {
            throw "owned verifier VHD path is missing"
          }
          $fullVhdPath = [IO.Path]::GetFullPath($vhdPath)
          $leaf = Split-Path -Leaf $fullVhdPath
          if (-not $fullVhdPath.StartsWith($runnerTemp, [StringComparison]::OrdinalIgnoreCase) -or
              $leaf -notmatch '^wayland-nano-verifier-[0-9a-f]{32}\.vhdx$') {
            throw "refusing to clean an unowned verifier VHD path"
          }
          if (-not (Test-Path -LiteralPath $fullVhdPath)) {
            Write-Warning "owned verifier VHD is already absent"
            exit 0
          }

          $cleanupScript = Join-Path $env:RUNNER_TEMP "wayland-nano-vhd-cleanup-$([Guid]::NewGuid().ToString('N')).txt"
          try {
            @(
              "select vdisk file=`"$fullVhdPath`""
              "detach vdisk"
            ) | Set-Content -LiteralPath $cleanupScript -Encoding ascii
            & diskpart.exe /s $cleanupScript
            if ($LASTEXITCODE -ne 0) {
              Write-Warning "diskpart could not detach the owned verifier VHD"
              exit 0
            }
            $image = Get-DiskImage -ImagePath $fullVhdPath -ErrorAction SilentlyContinue
            if ($image -and $image.Attached) {
              Write-Warning "owned verifier VHD remains attached; retaining its backing file"
              exit 0
            }
            Remove-Item -LiteralPath $fullVhdPath -Force
          } finally {
            Remove-Item -LiteralPath $cleanupScript -Force -ErrorAction SilentlyContinue
          }

  gate-cards:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - uses: dtolnay/rust-toolchain@master
        with: { toolchain: "1.95.0" }

      - name: Create owned F volume and exact-SHA worktree
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ((Get-PSDrive F -ErrorAction SilentlyContinue) -or (Test-Path 'F:\')) { throw 'F: already exists' }
          $token = [Guid]::NewGuid().ToString('N')
          $vhd = Join-Path $env:RUNNER_TEMP "wayland-nano-gate-cards-$token.vhdx"
          $setup = Join-Path $env:RUNNER_TEMP "gate-cards-setup-$token.txt"
          $detach = Join-Path $env:RUNNER_TEMP "gate-cards-detach-$token.txt"
          try {
            @("create vdisk file=`"$vhd`" maximum=8192 type=expandable", "select vdisk file=`"$vhd`"", 'attach vdisk',
              'create partition primary', 'format fs=ntfs quick label=WNGATECARDS', 'assign letter=F') |
              Set-Content -LiteralPath $setup -Encoding ascii
            & diskpart.exe /s $setup
            if ($LASTEXITCODE -ne 0) { throw 'diskpart setup failed' }
            $volume = Get-Volume -DriveLetter F -ErrorAction Stop
            if ($volume.FileSystem -ne 'NTFS' -or $volume.FileSystemLabel -ne 'WNGATECARDS') { throw 'unowned F volume' }
            "WN_GC_VHD=$vhd" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
            'WN_GC_VHD_OWNED=1' | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
            New-Item -ItemType Directory -Force F:\tmp | Out-Null
            'TEMP=F:\tmp' | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
            'TMP=F:\tmp' | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
            git worktree add --detach F:\repo $env:GITHUB_SHA
            if ($LASTEXITCODE -ne 0 -or (git -C F:\repo rev-parse HEAD).Trim() -ne $env:GITHUB_SHA) { throw 'worktree identity failed' }
            'WN_GC_WT_OWNED=1' | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          } catch {
            if (Test-Path F:\repo) { git worktree remove --force F:\repo; git worktree prune }
            if (Test-Path $vhd) {
              @("select vdisk file=`"$vhd`"", 'detach vdisk') | Set-Content $detach -Encoding ascii
              & diskpart.exe /s $detach | Out-Null
              if (-not (Get-DiskImage $vhd -ErrorAction SilentlyContinue).Attached) { Remove-Item $vhd -Force -ErrorAction SilentlyContinue }
            }
            throw
          } finally { Remove-Item $setup, $detach -Force -ErrorAction SilentlyContinue }

      - name: Build landed verifier and helpers
        working-directory: F:\repo
        run: cargo build -p nano-cli -p nano-sandbox --bins

      - name: Stage authentic sealed npm payload
        shell: pwsh
        working-directory: F:\repo
        run: |
          New-Item -ItemType Directory -Force artifacts/npm-binaries | Out-Null
          Copy-Item -Recurse -Force gates/fixtures/install-payload/reference/binaries/* artifacts/npm-binaries/
          packaging/npm/scripts/pack.ps1 -Platform all -ArtifactRoot artifacts/npm-binaries

      - name: Restricted-token WP-3 dogfood
        shell: pwsh
        working-directory: F:\repo
        run: |
          $ErrorActionPreference = 'Stop'
          function Assert-Registry($registry) {
            $ids = @($registry.gates.PSObject.Properties.Name | Sort-Object)
            if (($ids -join ',') -ne 'config-schema,install-payload,provision-script') { throw 'canonical gate inventory drift' }
            $map = [ordered]@{'CARD-05'='install-payload';'CARD-06'='provision-script';'CARD-07'='config-schema'}
            foreach ($pair in $map.GetEnumerator()) { if ($registry.requirements.($pair.Key) -ne $pair.Value) { throw 'mapping drift' } }
            foreach ($id in $ids) {
              $e = $registry.gates.$id
              if (!(Test-Path $e.card -PathType Leaf) -or !(Test-Path $e.script -PathType Leaf) -or !(Test-Path $e.run_artifact) -or
                  $e.closure.argv.Count -lt 2 -or $e.closure.cwd_policy -ne 'repo-root' -or $e.closure_digest -notmatch '^[0-9a-f]{64}$') {
                throw "invalid closure: $id"
              }
            }
            return ,$ids
          }
          $gateIds = Assert-Registry (Get-Content gates/registry.json -Raw | ConvertFrom-Json)
          node -e "const c=require('crypto'),r=require('./gates/registry.json');for(const [id,e] of Object.entries(r.gates))if(c.createHash('sha256').update(JSON.stringify(e.closure)).digest('hex')!==e.closure_digest)throw Error(id)"
          if ($LASTEXITCODE -ne 0) { throw 'closure digest drift' }
          $child = 'F:\gate-cards-child.ps1'; $resultPath = 'F:\gate-cards-result.json'
          @'
          $ErrorActionPreference='Stop'; Set-Location 'F:\repo'; $out='F:\gate-cards-result.json'; $tmp='F:\gate-cards-result.tmp'
          try {
            $p=[Security.Principal.WindowsPrincipal]::new([Security.Principal.WindowsIdentity]::GetCurrent())
            if($p.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)){throw 'administrator token'}
            & net.exe session *> $null; if($LASTEXITCODE -eq 0){throw 'administrator operation succeeded'}
            $r=Get-Content gates/registry.json -Raw|ConvertFrom-Json; $ids=@($r.gates.PSObject.Properties.Name|Sort-Object)
            if(($ids-join ',') -ne 'config-schema,install-payload,provision-script'){throw 'inventory'}
            $m=[ordered]@{'CARD-05'='install-payload';'CARD-06'='provision-script';'CARD-07'='config-schema'}
            foreach($x in $m.GetEnumerator()){if($r.requirements.($x.Key)-ne$x.Value){throw 'mapping'}}
            foreach($id in $ids){$e=$r.gates.$id;if(!(Test-Path $e.card -PathType Leaf)-or!(Test-Path $e.script -PathType Leaf)-or!(Test-Path $e.run_artifact)-or$e.closure.argv.Count-lt 2-or$e.closure.cwd_policy-ne'repo-root'-or$e.closure_digest-notmatch'^[0-9a-f]{64}$'){throw 'closure'}}
            # Exact landed WP-3 contract: verify --gate "$gate_id" --run-only
            $good=@(); foreach($gate_id in $ids){& .\target\debug\wayland-nano.exe verify --gate $gate_id --run-only; $good+= $LASTEXITCODE; if($LASTEXITCODE-ne 0){throw "good $gate_id"}}
            Copy-Item -Force packaging/npm/binaries/win32-x64/wayland-nano.exe packaging/npm/binaries/linux-x64/wayland-nano
            & .\target\debug\wayland-nano.exe verify --gate install-payload --run-only; $bad=$LASTEXITCODE; if($bad-ne 3){throw 'ip-m1 escaped'}
            [ordered]@{schema='nano.gate-cards-ci/1';restricted=$true;gates=$ids;good_exit=$good;bad_id='ip-m1';bad_exit=$bad}|ConvertTo-Json -Compress|Set-Content $tmp -Encoding utf8
            Move-Item -Force $tmp $out
          } catch {[ordered]@{schema='nano.gate-cards-ci/1';restricted=$true;error=$_.Exception.Message}|ConvertTo-Json -Compress|Set-Content $tmp -Encoding utf8;Move-Item -Force $tmp $out;exit 1}
          '@ | Set-Content $child -Encoding utf8
          $launcherSource = @'
          using System;
          using System.ComponentModel;
          using System.Runtime.InteropServices;
          using System.Text;

          public static class GateCardsRestrictedProcess {
              const UInt32 TOKEN_ASSIGN_PRIMARY = 0x0001;
              const UInt32 TOKEN_DUPLICATE = 0x0002;
              const UInt32 TOKEN_QUERY = 0x0008;
              const UInt32 DISABLE_MAX_PRIVILEGE = 0x00000001;
              const UInt32 LUA_TOKEN = 0x00000004;
              const UInt32 CREATE_SUSPENDED = 0x00000004;
              const UInt32 CREATE_NO_WINDOW = 0x08000000;
              const UInt32 JOB_OBJECT_LIMIT_KILL_ON_JOB_CLOSE = 0x00002000;
              const UInt32 JobObjectExtendedLimitInformation = 9;
              const UInt32 WAIT_OBJECT_0 = 0x00000000;
              const UInt32 WAIT_TIMEOUT = 0x00000102;
              const UInt32 STILL_ACTIVE = 259;
              const UInt32 ERROR_ACCESS_DENIED = 5;
              const string Application = @"C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe";
              const string Command = "powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File F:\\gate-cards-child.ps1";
              const string WorkingDirectory = @"F:\repo";

              [StructLayout(LayoutKind.Sequential, CharSet = CharSet.Unicode)]
              struct STARTUPINFO { public UInt32 cb; public string lpReserved; public string lpDesktop; public string lpTitle; public UInt32 dwX; public UInt32 dwY; public UInt32 dwXSize; public UInt32 dwYSize; public UInt32 dwXCountChars; public UInt32 dwYCountChars; public UInt32 dwFillAttribute; public UInt32 dwFlags; public Int16 wShowWindow; public Int16 cbReserved2; public IntPtr lpReserved2; public IntPtr hStdInput; public IntPtr hStdOutput; public IntPtr hStdError; }
              [StructLayout(LayoutKind.Sequential)]
              struct PROCESS_INFORMATION { public IntPtr hProcess; public IntPtr hThread; public UInt32 dwProcessId; public UInt32 dwThreadId; }
              [StructLayout(LayoutKind.Sequential)]
              struct JOBOBJECT_BASIC_LIMIT_INFORMATION { public Int64 PerProcessUserTimeLimit; public Int64 PerJobUserTimeLimit; public UInt32 LimitFlags; public UIntPtr MinimumWorkingSetSize; public UIntPtr MaximumWorkingSetSize; public UInt32 ActiveProcessLimit; public UIntPtr Affinity; public UInt32 PriorityClass; public UInt32 SchedulingClass; }
              [StructLayout(LayoutKind.Sequential)]
              struct IO_COUNTERS { public UInt64 ReadOperationCount; public UInt64 WriteOperationCount; public UInt64 OtherOperationCount; public UInt64 ReadTransferCount; public UInt64 WriteTransferCount; public UInt64 OtherTransferCount; }
              [StructLayout(LayoutKind.Sequential)]
              struct JOBOBJECT_EXTENDED_LIMIT_INFORMATION { public JOBOBJECT_BASIC_LIMIT_INFORMATION BasicLimitInformation; public IO_COUNTERS IoInfo; public UIntPtr ProcessMemoryLimit; public UIntPtr JobMemoryLimit; public UIntPtr PeakProcessMemoryUsed; public UIntPtr PeakJobMemoryUsed; }

              [DllImport("kernel32.dll")] static extern IntPtr GetCurrentProcess();
              [DllImport("advapi32.dll", SetLastError=true)] static extern bool OpenProcessToken(IntPtr ProcessHandle, UInt32 DesiredAccess, out IntPtr TokenHandle);
              [DllImport("advapi32.dll", SetLastError=true)] static extern bool CreateRestrictedToken(IntPtr ExistingTokenHandle, UInt32 Flags, UInt32 DisableSidCount, IntPtr SidsToDisable, UInt32 DeletePrivilegeCount, IntPtr PrivilegesToDelete, UInt32 RestrictedSidCount, IntPtr SidsToRestrict, out IntPtr NewTokenHandle);
              [DllImport("advapi32.dll", CharSet=CharSet.Unicode, SetLastError=true)] static extern bool CreateProcessAsUserW(IntPtr hToken, string lpApplicationName, StringBuilder lpCommandLine, IntPtr lpProcessAttributes, IntPtr lpThreadAttributes, bool bInheritHandles, UInt32 dwCreationFlags, IntPtr lpEnvironment, string lpCurrentDirectory, ref STARTUPINFO lpStartupInfo, out PROCESS_INFORMATION lpProcessInformation);
              [DllImport("kernel32.dll", CharSet=CharSet.Unicode, SetLastError=true)] static extern IntPtr CreateJobObjectW(IntPtr lpJobAttributes, string lpName);
              [DllImport("kernel32.dll", SetLastError=true)] static extern bool SetInformationJobObject(IntPtr hJob, UInt32 JobObjectInfoClass, IntPtr lpJobObjectInfo, UInt32 cbJobObjectInfoLength);
              [DllImport("kernel32.dll", SetLastError=true)] static extern bool AssignProcessToJobObject(IntPtr hJob, IntPtr hProcess);
              [DllImport("kernel32.dll", SetLastError=true)] static extern UInt32 ResumeThread(IntPtr hThread);
              [DllImport("kernel32.dll", SetLastError=true)] static extern UInt32 WaitForSingleObject(IntPtr hHandle, UInt32 dwMilliseconds);
              [DllImport("kernel32.dll", SetLastError=true)] static extern bool GetExitCodeProcess(IntPtr hProcess, out UInt32 lpExitCode);
              [DllImport("kernel32.dll", SetLastError=true)] static extern bool TerminateJobObject(IntPtr hJob, UInt32 uExitCode);
              [DllImport("kernel32.dll", SetLastError=true)] static extern bool TerminateProcess(IntPtr hProcess, UInt32 uExitCode);
              [DllImport("kernel32.dll")] static extern bool CloseHandle(IntPtr hObject);

              static void Check(bool ok, string operation) { if (!ok) throw new Win32Exception(Marshal.GetLastWin32Error(), operation); }

              public static int Run() {
                  IntPtr currentToken=IntPtr.Zero, restrictedToken=IntPtr.Zero, job=IntPtr.Zero;
                  PROCESS_INFORMATION pi=new PROCESS_INFORMATION(); bool assigned=false;
                  try {
                      Check(OpenProcessToken(GetCurrentProcess(), TOKEN_ASSIGN_PRIMARY|TOKEN_DUPLICATE|TOKEN_QUERY, out currentToken), "OpenProcessToken");
                      Check(CreateRestrictedToken(currentToken, DISABLE_MAX_PRIVILEGE|LUA_TOKEN, 0, IntPtr.Zero, 0, IntPtr.Zero, 0, IntPtr.Zero, out restrictedToken), "CreateRestrictedToken");
                      job=CreateJobObjectW(IntPtr.Zero, null); Check(job!=IntPtr.Zero, "CreateJobObjectW");
                      var limits=new JOBOBJECT_EXTENDED_LIMIT_INFORMATION(); limits.BasicLimitInformation.LimitFlags=JOB_OBJECT_LIMIT_KILL_ON_JOB_CLOSE;
                      int size=Marshal.SizeOf(limits); IntPtr limitsPtr=Marshal.AllocHGlobal(size);
                      try { Marshal.StructureToPtr(limits, limitsPtr, false); Check(SetInformationJobObject(job, JobObjectExtendedLimitInformation, limitsPtr, (UInt32)size), "SetInformationJobObject"); }
                      finally { Marshal.FreeHGlobal(limitsPtr); }
                      var startup=new STARTUPINFO(); startup.cb=(UInt32)Marshal.SizeOf(startup);
                      Check(CreateProcessAsUserW(restrictedToken, Application, new StringBuilder(Command), IntPtr.Zero, IntPtr.Zero, false, CREATE_SUSPENDED|CREATE_NO_WINDOW, IntPtr.Zero, WorkingDirectory, ref startup, out pi), "CreateProcessAsUserW");
                      Check(AssignProcessToJobObject(job, pi.hProcess), "AssignProcessToJobObject"); assigned=true;
                      if (ResumeThread(pi.hThread)==UInt32.MaxValue) throw new Win32Exception(Marshal.GetLastWin32Error(), "ResumeThread");
                      UInt32 wait=WaitForSingleObject(pi.hProcess, 1200000);
                      if (wait==WAIT_TIMEOUT) { Check(TerminateJobObject(job, 124), "TerminateJobObject(timeout)"); UInt32 stopped=WaitForSingleObject(pi.hProcess, 30000); if(stopped!=WAIT_OBJECT_0) throw new TimeoutException("restricted child termination timeout"); throw new TimeoutException("restricted child timeout"); }
                      if (wait!=WAIT_OBJECT_0) throw new Win32Exception(Marshal.GetLastWin32Error(), "WaitForSingleObject");
                      UInt32 exitCode; Check(GetExitCodeProcess(pi.hProcess, out exitCode), "GetExitCodeProcess");
                      if(exitCode==STILL_ACTIVE) throw new InvalidOperationException("restricted child remained active");
                      return unchecked((int)exitCode);
                  } catch {
                      if(pi.hProcess!=IntPtr.Zero) { if(assigned && job!=IntPtr.Zero) TerminateJobObject(job, 125); else TerminateProcess(pi.hProcess, 125); WaitForSingleObject(pi.hProcess, 30000); }
                      throw;
                  } finally {
                      if(pi.hThread!=IntPtr.Zero) CloseHandle(pi.hThread); if(pi.hProcess!=IntPtr.Zero) CloseHandle(pi.hProcess);
                      if(restrictedToken!=IntPtr.Zero) CloseHandle(restrictedToken); if(currentToken!=IntPtr.Zero) CloseHandle(currentToken);
                      if(job!=IntPtr.Zero) CloseHandle(job);
                  }
              }
          }
          '@
          $needles = @(
            'OpenProcessToken', 'CreateRestrictedToken', 'DISABLE_MAX_PRIVILEGE|LUA_TOKEN', 'CreateProcessAsUserW',
            'CREATE_SUSPENDED|CREATE_NO_WINDOW', 'CreateJobObjectW', 'SetInformationJobObject',
            'JOB_OBJECT_LIMIT_KILL_ON_JOB_CLOSE', 'AssignProcessToJobObject', 'ResumeThread',
            'WaitForSingleObject(pi.hProcess, 1200000)', 'TerminateJobObject(job, 124)',
            'WaitForSingleObject(pi.hProcess, 30000)', 'GetExitCodeProcess', 'CloseHandle'
          )
          foreach($needle in $needles){if(!$launcherSource.Contains($needle)){throw "restricted launcher assertion failed: $needle"}}
          $ordered = @('Check(OpenProcessToken(', 'Check(CreateRestrictedToken(', 'job=CreateJobObjectW(',
            'Check(SetInformationJobObject(', 'Check(CreateProcessAsUserW(',
            'Check(AssignProcessToJobObject(', 'if (ResumeThread(', 'UInt32 wait=WaitForSingleObject(',
            'Check(GetExitCodeProcess(')
          $previous = -1
          foreach($needle in $ordered){$position=$launcherSource.IndexOf($needle,[StringComparison]::Ordinal);if($position-le$previous){throw "restricted launcher order failed: $needle"};$previous=$position}
          $parseTokens=$null;$parseErrors=$null
          [Management.Automation.Language.Parser]::ParseFile($child,[ref]$parseTokens,[ref]$parseErrors)|Out-Null
          if($parseErrors.Count-ne 0){throw 'restricted child PowerShell parse failed'}
          Add-Type -TypeDefinition $launcherSource
          $childExit=[GateCardsRestrictedProcess]::Run()
          if($childExit-ne 0){throw "restricted child failed with exit $childExit"}
          $deadline=[DateTime]::UtcNow.AddSeconds(10);while(!(Test-Path $resultPath)-and[DateTime]::UtcNow-lt$deadline){Start-Sleep -Milliseconds 100}
          if(!(Test-Path $resultPath)){throw 'missing restricted result'}
          $result=Get-Content $resultPath -Raw|ConvertFrom-Json
          $fields=@($result.PSObject.Properties.Name|Sort-Object);$expected=@('bad_exit','bad_id','gates','good_exit','restricted','schema')|Sort-Object
          if(($fields-join ',')-ne($expected-join ',')-or$result.schema-ne'nano.gate-cards-ci/1'-or$result.restricted-ne$true-or
             (@($result.gates)-join ',')-ne($gateIds-join ',')-or(@($result.good_exit)-join ',')-ne'0,0,0'-or$result.bad_id-ne'ip-m1'-or$result.bad_exit-ne 3){throw 'closed restricted result invalid'}
          Remove-Item $child,$resultPath -Force

      - name: Require clean producer tree
        if: always()
        shell: pwsh
        working-directory: F:\repo
        run: |
          Remove-Item -Recurse -Force packaging/npm/binaries -ErrorAction SilentlyContinue
          Remove-Item -Force packaging/npm/binaries-manifest.json -ErrorAction SilentlyContinue
          $status=git status --short -- packaging/npm
          if($LASTEXITCODE-ne 0-or$status){throw "producer residue: $status"}

      - name: Remove owned worktree and F volume
        if: always()
        shell: pwsh
        run: |
          $failed=$false
          Remove-Item F:\gate-cards-child.ps1,F:\gate-cards-result.json,F:\gate-cards-result.tmp -Force -ErrorAction SilentlyContinue
          if($env:WN_GC_WT_OWNED-eq'1'){git worktree remove --force F:\repo;if($LASTEXITCODE-ne 0){$failed=$true};git worktree prune;if($LASTEXITCODE-ne 0){$failed=$true};if((git worktree list --porcelain)-match'(?im)^worktree F:[/\\]repo$'){$failed=$true}}
          if($env:WN_GC_VHD_OWNED-eq'1'){
            $root=[IO.Path]::GetFullPath($env:RUNNER_TEMP).TrimEnd('\')+'\';$vhd=[IO.Path]::GetFullPath($env:WN_GC_VHD);$leaf=Split-Path -Leaf $vhd
            if(!$vhd.StartsWith($root,[StringComparison]::OrdinalIgnoreCase)-or$leaf-notmatch'^wayland-nano-gate-cards-[0-9a-f]{32}\.vhdx$'){throw 'unowned cleanup path'}
            $script=Join-Path $env:RUNNER_TEMP "gate-cards-cleanup-$([Guid]::NewGuid().ToString('N')).txt"
            try {
              @("select vdisk file=`"$vhd`"",'detach vdisk') | Set-Content $script -Encoding ascii
              & diskpart.exe /s $script
              if($LASTEXITCODE-ne 0){$failed=$true}
              $image=Get-DiskImage $vhd -ErrorAction SilentlyContinue
              if($image-and$image.Attached){$failed=$true}elseif(Test-Path $vhd){Remove-Item $vhd -Force}
              if(Test-Path $vhd){$failed=$true}
            } finally { Remove-Item $script -Force -ErrorAction SilentlyContinue }
          }
          if($failed){throw 'owned cleanup failed'}
