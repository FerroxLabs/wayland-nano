# Wayland Nano — publish workflow (tag-driven, provenance-signed)
#
# Fires on version tags (v*). Builds the release binaries on the matrix,
# stages the npm package, publishes `waylandnano` with npm provenance
# (Sigstore), and uploads the evidence bundle. The publish step needs ONE
# owner action: add the waylandnano-scope npm automation token as the
# NPM_TOKEN secret in the GitHub repo settings (Settings → Secrets →
# Actions). The token never touches a file or chat.

name: wayland-nano-release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # GitHub release assets (Desktop bundling downloads from these)
  id-token: write # npm provenance (Sigstore OIDC) + build-provenance attestation
  attestations: write # SLSA provenance for the release archives (Desktop's bundling gate)

# TEMPORARY BYPASS - REMOVE ONCE AZURE CREDENTIALS ARE PROVISIONED.
# The Windows Authenticode gate below is armed but currently bypassed: no
# AZURE_* secrets exist in this repo yet, so a fail-closed gate would block the
# next Nano release outright. While this flag is "1" a tag build still publishes
# an UNSIGNED wayland-nano.exe and prints a loud warning in the run summary.
# Delete this whole env block (flag and comment) the moment the credentials and
# the AZURE_SIGNING_* repository variables exist - the gate then fails closed on
# its own with no further edit.
env:
  WNANO_ALLOW_UNSIGNED_WINDOWS: "1"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            pkg: win32-x64
          - os: macos-14
            target: aarch64-apple-darwin
            pkg: darwin-arm64
          - os: macos-15-intel
            target: x86_64-apple-darwin
            pkg: darwin-x64
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            pkg: linux-x64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            pkg: linux-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"
          components: rustfmt, clippy
          targets: ${{ matrix.target }}

      # The gate must pass on the tagged commit before any artifact exists.
      - name: Install just
        uses: taiki-e/install-action@just

      # Verifier temp parity with gate.yml: the verify (WP-3) integration
      # tests' process-isolation contract requires TEMP and TMP to name the
      # same canonical directory. gate.yml has done this since the verifier
      # tests landed; release.yml ran gate-test without it and every platform
      # leg failed ("unverifiable" verdicts) on the first tag that carried
      # WP-3. Keep these steps byte-identical to gate.yml's.
      - name: Configure verifier temp directory (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if ((Get-PSDrive -Name F -ErrorAction SilentlyContinue) -or (Test-Path -LiteralPath "F:\")) {
            throw "F: is already in use; refusing to replace an existing drive"
          }

          $runToken = [Guid]::NewGuid().ToString("N")
          $vhdPath = Join-Path $env:RUNNER_TEMP "wayland-nano-verifier-$runToken.vhdx"
          $setupScript = Join-Path $env:RUNNER_TEMP "wayland-nano-vhd-setup-$runToken.txt"
          $detachScript = Join-Path $env:RUNNER_TEMP "wayland-nano-vhd-detach-$runToken.txt"
          $diskpartSetup = @(
            "create vdisk file=`"$vhdPath`" maximum=8192 type=expandable"
            "select vdisk file=`"$vhdPath`""
            "attach vdisk"
            "create partition primary"
            "format fs=ntfs quick label=WNVERIFY"
            "assign letter=F"
          )

          try {
            $diskpartSetup | Set-Content -LiteralPath $setupScript -Encoding ascii
            & diskpart.exe /s $setupScript
            if ($LASTEXITCODE -ne 0) {
              throw "diskpart failed while creating the verifier volume"
            }
            $volume = Get-Volume -DriveLetter F -ErrorAction Stop
            if ($volume.FileSystem -ne "NTFS" -or $volume.FileSystemLabel -ne "WNVERIFY") {
              throw "F: is not the owned NTFS verifier volume"
            }

            # Persist ownership immediately after attach/assign. Later cleanup
            # is forbidden from touching any VHD or drive not named here.
            "WN_TEMP_VHD_PATH=$vhdPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            "WN_TEMP_VHD_OWNED=1" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            $verifierTemp = "F:\tmp"
            New-Item -ItemType Directory -Force -Path $verifierTemp | Out-Null
            if (-not (Test-Path -LiteralPath $verifierTemp -PathType Container)) {
              throw "failed to create the verifier temp child directory"
            }
            "WN_VERIFY_TEMP=$verifierTemp" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          } catch {
            # A failed diskpart script can leave a partially attached image.
            # Select only this run's unique image and detach it if present.
            if (Test-Path -LiteralPath $vhdPath) {
              @(
                "select vdisk file=`"$vhdPath`""
                "detach vdisk"
              ) | Set-Content -LiteralPath $detachScript -Encoding ascii
              & diskpart.exe /s $detachScript | Out-Null
              if (-not (Get-DiskImage -ImagePath $vhdPath -ErrorAction SilentlyContinue).Attached) {
                Remove-Item -LiteralPath $vhdPath -Force -ErrorAction SilentlyContinue
              }
            }
            throw
          } finally {
            Remove-Item -LiteralPath $setupScript, $detachScript -Force -ErrorAction SilentlyContinue
          }

      - name: Configure verifier temp directory (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          verifier_temp="${RUNNER_TEMP}/wayland-nano-verifier"
          mkdir -p "$verifier_temp"
          echo "TEMP=$verifier_temp" >> "$GITHUB_ENV"
          echo "TMP=$verifier_temp" >> "$GITHUB_ENV"
          echo "TMPDIR=$verifier_temp" >> "$GITHUB_ENV"

      - name: gate-fmt
        run: just gate-fmt
      - name: gate-lint
        run: just gate-lint
      - name: Build workspace binaries (unix sandbox helpers)
        if: runner.os != 'Windows'
        run: cargo build --workspace --bins

      # The unix shell tests exercise the default bwrap path; hosted Ubuntu
      # doesn't ship bubblewrap, and 24.04 restricts userns via AppArmor.
      - name: Install bubblewrap (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y bubblewrap
          sudo sysctl kernel.apparmor_restrict_unprivileged_userns=0 || true
          sudo sysctl kernel.unprivileged_userns_clone=1 || true
      - name: gate-test
        if: runner.os != 'Windows'
        run: just gate-test

      # Windows verifier split, byte-identical to gate.yml: unrelated tests
      # keep the runner's native TEMP/TMP; the 14 verify (WP-3) integration
      # tests run once below under the scoped short verifier temp path.
      - name: gate-test (Windows workspace)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $verifierTests = @(
            "verify_authored_defect_red_identifiers_only"
            "verify_receipt_roundtrip_valid"
            "verify_receipt_tampered_fails_closed"
            "verify_receipt_fabricated_commit"
            "verify_receipt_unknown_field_fails_closed"
            "verify_receipt_green_only_is_never_red"
            "verify_receipt_gate_pin_drift"
            "verify_exit_code_matrix"
            "verify_red_run_writes_no_receipt"
            "verify_receipt_ancestry_unproven"
            "verify_receipt_rerun_red_is_gate_mismatch"
            "verify_run_only_resolves_artifact_and_exit_codes"
            "verify_full_flow_green_mints_receipt"
            "fixture_materializes_real_history_and_resolves_templates"
          )
          $listOutput = & cargo test -p nano-cli --test verify_cmd -- --list 2>&1
          if ($LASTEXITCODE -ne 0) {
            $listOutput | Write-Output
            throw "failed to enumerate verify_cmd tests"
          }
          $declared = @($listOutput | ForEach-Object {
            if ($_ -match '^([^:]+): test$') { $Matches[1] }
          })
          $uniqueDeclared = @($declared | Sort-Object -Unique)
          if ($declared.Count -ne 14 -or $uniqueDeclared.Count -ne 14) {
            throw "verify_cmd must contain exactly 14 unique tests; found $($declared.Count) entries and $($uniqueDeclared.Count) unique names"
          }
          $declaredInventory = $uniqueDeclared -join "`n"
          $expectedInventory = ($verifierTests | Sort-Object) -join "`n"
          if ($declaredInventory -ne $expectedInventory) {
            throw "verify_cmd test inventory drifted; update the scoped Windows gate explicitly"
          }
          $cargoArgs = @("test", "--workspace", "--")
          foreach ($test in $verifierTests) {
            $cargoArgs += @("--skip", $test)
          }
          & cargo @cargoArgs
          if ($LASTEXITCODE -ne 0) {
            throw "Windows workspace tests failed"
          }

      - name: gate-test (Windows verifier scoped temp)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not $env:WN_VERIFY_TEMP) {
            throw "WN_VERIFY_TEMP was not configured"
          }
          $env:TEMP = $env:WN_VERIFY_TEMP
          $env:TMP = $env:WN_VERIFY_TEMP
          cargo test -p nano-cli --test verify_cmd -- --test-threads=1
          if ($LASTEXITCODE -ne 0) {
            throw "Windows verifier integration tests failed"
          }

      - name: Release build
        run: cargo build --release -p nano-cli --target ${{ matrix.target }}

      # P4 PTY: the unix PTY host-death sentinel ships beside the host
      # binary (pack.ps1 stages it; Windows uses ConPTY + Job Objects and
      # needs no guard).
      - name: Release build (unix PTY guard)
        if: runner.os != 'Windows'
        run: cargo build --release -p nano-tools --bin wayland-nano-pty-guard --target ${{ matrix.target }}

      # --- Windows Authenticode -------------------------------------------
      # Authenticode is what Windows itself checks at load time (SmartScreen,
      # Smart App Control, Defender); it never consults the SLSA attestation
      # this workflow already produces. The two controls are complementary and
      # neither replaces the other.
      #
      # ORDERING IS LOAD-BEARING: signing REWRITES the PE, so it must happen
      # after the release build and BEFORE "Stage binary" below. pack.ps1 hashes
      # the staged file into binaries-manifest.json (Get-FileHash, pack.ps1
      # ~L123), and every downstream control derives from those exact bytes:
      # the npm integrity check (bin/install.js), the uploaded artifact, the
      # publish leg's zip + shasums manifest, the SLSA attestation, and the
      # GitHub release asset Desktop pins by digest. Signing anywhere later
      # would leave every one of those digests describing bytes that no longer
      # ship.
      #
      # This workflow only ever runs on a v* tag, so "on a release tag" is
      # every run - there is no non-release path to exempt.
      - name: Windows signing preflight
        id: winsign
        if: runner.os == 'Windows'
        shell: bash
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SIGNING_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          AZURE_SIGNING_CERT_PROFILE: ${{ vars.AZURE_SIGNING_CERT_PROFILE }}
        run: |
          set -euo pipefail
          missing=""
          [ -n "$AZURE_TENANT_ID" ] || missing="$missing AZURE_TENANT_ID(secret)"
          [ -n "$AZURE_CLIENT_ID" ] || missing="$missing AZURE_CLIENT_ID(secret)"
          [ -n "$AZURE_SIGNING_ENDPOINT" ] || missing="$missing AZURE_SIGNING_ENDPOINT(var)"
          [ -n "$AZURE_SIGNING_ACCOUNT" ] || missing="$missing AZURE_SIGNING_ACCOUNT(var)"
          [ -n "$AZURE_SIGNING_CERT_PROFILE" ] || missing="$missing AZURE_SIGNING_CERT_PROFILE(var)"
          if [ -z "$missing" ]; then
            # AZURE_CLIENT_SECRET present => client-secret auth. Absent => the
            # OIDC path, where azure/login mints a short-lived federated token
            # and no long-lived secret is ever stored.
            if [ -n "$AZURE_CLIENT_SECRET" ]; then mode=client-secret; else mode=oidc; fi
            echo "sign=true" >> "$GITHUB_OUTPUT"
            echo "mode=$mode" >> "$GITHUB_OUTPUT"
            echo "Authenticode signing enabled (auth mode: $mode)."
            exit 0
          fi
          echo "sign=false" >> "$GITHUB_OUTPUT"
          echo "mode=none" >> "$GITHUB_OUTPUT"
          if [ "${WNANO_ALLOW_UNSIGNED_WINDOWS:-}" = "1" ]; then
            echo "::warning title=Windows binary is UNSIGNED::Authenticode signing is bypassed by WNANO_ALLOW_UNSIGNED_WINDOWS=1. Missing:$missing. This release ships an unsigned wayland-nano.exe."
            exit 0
          fi
          echo "::error title=Windows signing not configured::Refusing to publish an unsigned wayland-nano.exe. Missing:$missing. Provision them, or set WNANO_ALLOW_UNSIGNED_WINDOWS=1 in this workflow to ship unsigned deliberately."
          exit 1

      # OIDC federation: no long-lived secret in the repo. Requires a federated
      # credential on the App Registration scoped to this repo, and the
      # workflow-level id-token: write permission already granted above. The
      # signing action's DefaultAzureCredential picks up the CLI session this
      # establishes (AZURE_CLIENT_SECRET is empty in this mode, so the
      # EnvironmentCredential ahead of it is skipped).
      - name: Azure login (OIDC federation)
        if: steps.winsign.outputs.mode == 'oidc'
        uses: azure/login@v3.0.1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign wayland-nano.exe (Azure Trusted Signing)
        if: steps.winsign.outputs.sign == 'true'
        uses: azure/trusted-signing-action@v2.0.0
        with:
          # Client-secret mode consumes all three; OIDC mode leaves the secret
          # empty and authenticates through the azure/login session above.
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_SIGNING_CERT_PROFILE }}
          files: ${{ github.workspace }}\target\${{ matrix.target }}\release\wayland-nano.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description: Wayland Nano
          description-url: https://github.com/FerroxLabs/wayland-nano

      # The signing action can succeed without producing a trusted signature
      # (wrong profile, silent no-op). Prove the shipped PE actually validates
      # before its bytes are hashed into the manifest.
      - name: Verify Authenticode signature
        if: steps.winsign.outputs.sign == 'true'
        shell: pwsh
        run: |
          $exe = "target/${{ matrix.target }}/release/wayland-nano.exe"
          $sig = Get-AuthenticodeSignature -FilePath $exe
          if ($sig.Status -ne 'Valid') {
            throw "Authenticode verification failed for $exe (status: $($sig.Status) - $($sig.StatusMessage))"
          }
          Write-Host "Authenticode OK: $($sig.SignerCertificate.Subject)"
      # --- end Windows Authenticode ---------------------------------------

      - name: Stage binary
        shell: pwsh
        run: packaging/npm/scripts/pack.ps1 -Platform ${{ matrix.pkg }} -SkipBuild

      - name: Verify platform package
        working-directory: packaging/npm
        run: |
          node --check bin/install.js
          node --check bin/wayland-nano.js
          node bin/install.js
      - uses: actions/upload-artifact@v4
        with:
          name: nano-bin-${{ matrix.pkg }}
          # Preserve the platform directory so merge-multiple produces the
          # ArtifactRoot layout consumed by pack.ps1.
          path: packaging/npm/binaries/

      # Byte-identical to gate.yml's cleanup: detach only the owned,
      # token-named verifier VHD created at the start of this job.
      - name: Remove verifier temp volume (Windows)
        if: always() && runner.os == 'Windows' && env.WN_TEMP_VHD_OWNED == '1'
        shell: pwsh
        run: |
          $vhdPath = $env:WN_TEMP_VHD_PATH
          $runnerTemp = [IO.Path]::GetFullPath($env:RUNNER_TEMP).TrimEnd('\') + '\'
          if ([string]::IsNullOrWhiteSpace($vhdPath)) {
            throw "owned verifier VHD path is missing"
          }
          $fullVhdPath = [IO.Path]::GetFullPath($vhdPath)
          $leaf = Split-Path -Leaf $fullVhdPath
          if (-not $fullVhdPath.StartsWith($runnerTemp, [StringComparison]::OrdinalIgnoreCase) -or
              $leaf -notmatch '^wayland-nano-verifier-[0-9a-f]{32}\.vhdx$') {
            throw "refusing to clean an unowned verifier VHD path"
          }
          if (-not (Test-Path -LiteralPath $fullVhdPath)) {
            Write-Warning "owned verifier VHD is already absent"
            exit 0
          }

          $cleanupScript = Join-Path $env:RUNNER_TEMP "wayland-nano-vhd-cleanup-$([Guid]::NewGuid().ToString('N')).txt"
          try {
            @(
              "select vdisk file=`"$fullVhdPath`""
              "detach vdisk"
            ) | Set-Content -LiteralPath $cleanupScript -Encoding ascii
            & diskpart.exe /s $cleanupScript
            if ($LASTEXITCODE -ne 0) {
              Write-Warning "diskpart could not detach the owned verifier VHD"
              exit 0
            }
            $image = Get-DiskImage -ImagePath $fullVhdPath -ErrorAction SilentlyContinue
            if ($image -and $image.Attached) {
              Write-Warning "owned verifier VHD remains attached; retaining its backing file"
              exit 0
            }
            Remove-Item -LiteralPath $fullVhdPath -Force
          } finally {
            Remove-Item -LiteralPath $cleanupScript -Force -ErrorAction SilentlyContinue
          }

  publish:
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Collect staged binaries
        uses: actions/download-artifact@v4
        with:
          pattern: nano-bin-*
          path: artifacts/npm-binaries
          merge-multiple: true

      - name: Assemble package and integrity manifest
        shell: pwsh
        run: packaging/npm/scripts/pack.ps1 -Platform all -ArtifactRoot artifacts/npm-binaries

      - name: Verify staged package contents
        working-directory: packaging/npm
        shell: bash
        run: |
          set -euo pipefail
          count=$(find binaries -type f -name 'wayland-nano*' | wc -l)
          echo "staged binaries: $count"
          # 5 platform hosts + the unix PTY guard on the 4 unix packages.
          [ "$count" -eq 9 ] || { echo "expected 9 platform binaries (5 hosts + 4 pty guards), found $count"; exit 1; }
          node bin/install.js

      - name: "Guard: tag must match package.json version"
        working-directory: packaging/npm
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          [ "v$VERSION" = "$GITHUB_REF_NAME" ] || { echo "tag/version mismatch: pushed $GITHUB_REF_NAME but package.json says $VERSION — bump package.json and re-tag"; exit 1; }

      - name: Pack + publish (provenance)
        working-directory: packaging/npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          node --check bin/install.js && node --check bin/wayland-nano.js
          VERSION=$(node -p "require('./package.json').version")
          if npm view "waylandnano@$VERSION" version >/dev/null 2>&1; then
            echo "waylandnano@$VERSION already published — skipping (idempotent rerun)"
            exit 0
          fi
          # Parity with getwayland: prerelease versions → next, stable → latest
          case "$VERSION" in
            *-*) DIST_TAG=next ;;
            *) DIST_TAG=latest ;;
          esac
          npm publish --provenance --access public --tag "$DIST_TAG"

      - name: Stage GitHub release archives
        working-directory: packaging/npm
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          # One zip per platform + a combined shasums manifest — the exact
          # shape Desktop's prepareWaylandNano.js downloads and verifies.
          manifest="{}"
          for dir in binaries/*/; do
            pkg=$(basename "$dir")
            bin="wayland-nano"; [ "$pkg" = "win32-x64" ] && bin="wayland-nano.exe"
            zip="wayland-nano-${VERSION}-${pkg}.zip"
            (cd "$dir" && zip -q "$OLDPWD/$zip" "$bin")
            sha=$(sha256sum "$zip" | cut -d' ' -f1)
            manifest=$(echo "$manifest" | jq --arg k "$pkg" --arg v "$sha" '. + {($k): $v}')
          done
          echo "$manifest" | jq . > "wayland-nano-${VERSION}-shasums.json"

      # Desktop REFUSES to bundle a runtime whose archive carries no SLSA
      # provenance: verifyWNanoRuntime in scripts/verify-packaged-resources.js
      # requires an attestation signed by THIS workflow, and fails closed
      # otherwise. Attest BEFORE the upload so a published asset is never left
      # unattested. The globs cover exactly the files staged above.
      - name: Attest release archives (SLSA provenance)
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            packaging/npm/wayland-nano-*.zip
            packaging/npm/wayland-nano-*-shasums.json

      - name: Publish GitHub release assets (Desktop bundling source)
        working-directory: packaging/npm
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          TAG="v$VERSION"
          assets=()
          for zip in wayland-nano-"${VERSION}"-*.zip; do assets+=("$zip"); done
          assets+=("wayland-nano-${VERSION}-shasums.json")
          gh release create "$TAG" --title "Wayland Nano $VERSION" --generate-notes "${assets[@]}" \
            || gh release upload "$TAG" "${assets[@]}" --clobber

      - name: Evidence bundle
        # DEBT: collect-evidence.ps1 is Windows-oriented and fails on the
        # ubuntu publish leg; the gate manifests already carry the evidence.
        # Post-publish bookkeeping — never block a successful publish on it.
        continue-on-error: true
        run: powershell -NoProfile -File scripts/collect-evidence.ps1 -BundleDir artifacts/evidence-bundle -AllowMissing
        shell: pwsh

      - uses: actions/upload-artifact@v4
        with:
          name: release-evidence-bundle
          path: artifacts/evidence-bundle/
