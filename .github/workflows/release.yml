# Wayland Nano — publish workflow (tag-driven, provenance-signed)
#
# Fires on version tags (v*). Builds the release binaries on the matrix,
# stages the npm package, publishes `waylandnano` with npm provenance
# (Sigstore), and uploads the evidence bundle. The publish step needs ONE
# owner action: add the waylandnano-scope npm automation token as the
# NPM_TOKEN secret in the GitHub repo settings (Settings → Secrets →
# Actions). The token never touches a file or chat.

name: wayland-nano-release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # GitHub release assets (Desktop bundling downloads from these)
  id-token: write # npm provenance (Sigstore OIDC)

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            pkg: win32-x64
          - os: macos-14
            target: aarch64-apple-darwin
            pkg: darwin-arm64
          - os: macos-15-intel
            target: x86_64-apple-darwin
            pkg: darwin-x64
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            pkg: linux-x64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            pkg: linux-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"
          components: rustfmt, clippy
          targets: ${{ matrix.target }}

      # The gate must pass on the tagged commit before any artifact exists.
      - name: Install just
        uses: taiki-e/install-action@just
      - name: gate-fmt
        run: just gate-fmt
      - name: gate-lint
        run: just gate-lint
      - name: Build workspace binaries (unix sandbox helpers)
        if: runner.os != 'Windows'
        run: cargo build --workspace --bins

      # The unix shell tests exercise the default bwrap path; hosted Ubuntu
      # doesn't ship bubblewrap, and 24.04 restricts userns via AppArmor.
      - name: Install bubblewrap (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y bubblewrap
          sudo sysctl kernel.apparmor_restrict_unprivileged_userns=0 || true
          sudo sysctl kernel.unprivileged_userns_clone=1 || true
      - name: gate-test
        run: just gate-test

      - name: Release build
        run: cargo build --release -p nano-cli --target ${{ matrix.target }}

      - name: Stage binary
        shell: bash
        run: |
          set -euo pipefail
          dest="staging/binaries/${{ matrix.pkg }}"
          mkdir -p "$dest"
          bin="wayland-nano"
          [ "${{ matrix.os }}" = "windows-latest" ] && bin="wayland-nano.exe"
          cp "target/${{ matrix.target }}/release/$bin" "$dest/"
          # sha256sum is GNU coreutils (linux/windows Git Bash); macOS images
          # only guarantee shasum.
          if command -v sha256sum >/dev/null 2>&1; then
            (cd "$dest" && sha256sum "$bin" > "$bin.sha256")
          else
            (cd "$dest" && shasum -a 256 "$bin" > "$bin.sha256")
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: nano-bin-${{ matrix.pkg }}
          path: staging/binaries/

  publish:
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Collect staged binaries
        uses: actions/download-artifact@v4
        with:
          pattern: nano-bin-*
          # Artifact contents are <pkg>/wayland-nano[.exe]; the package layout
          # (files: binaries/) and bin/install.js expect binaries/<pkg>/.
          path: packaging/npm/binaries
          merge-multiple: true

      - name: Verify staged package contents
        working-directory: packaging/npm
        shell: bash
        run: |
          set -euo pipefail
          count=$(find binaries -type f -name 'wayland-nano*' ! -name '*.sha256' | wc -l)
          echo "staged binaries: $count"
          [ "$count" -ge 5 ] || { echo "ERROR: expected 5 platform binaries, found $count"; exit 1; }

      - name: Pack + publish (provenance)
        working-directory: packaging/npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          node --check bin/install.js && node --check bin/wayland-nano.js
          VERSION=$(node -p "require('./package.json').version")
          if npm view "waylandnano@$VERSION" version >/dev/null 2>&1; then
            echo "waylandnano@$VERSION already published — skipping (idempotent rerun)"
            exit 0
          fi
          # Parity with getwayland: prerelease versions → next, stable → latest
          case "$VERSION" in
            *-*) DIST_TAG=next ;;
            *) DIST_TAG=latest ;;
          esac
          npm publish --provenance --access public --tag "$DIST_TAG"

      - name: GitHub release assets (Desktop bundling source)
        working-directory: packaging/npm
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          TAG="v$VERSION"
          # One zip per platform + a combined shasums manifest — the exact
          # shape Desktop's prepareWaylandNano.js downloads and verifies.
          assets=()
          manifest="{}"
          for dir in binaries/*/; do
            pkg=$(basename "$dir")
            bin="wayland-nano"; [ "$pkg" = "win32-x64" ] && bin="wayland-nano.exe"
            zip="wayland-nano-${VERSION}-${pkg}.zip"
            (cd "$dir" && zip -q "$OLDPWD/$zip" "$bin")
            sha=$(sha256sum "$zip" | cut -d' ' -f1)
            manifest=$(echo "$manifest" | jq --arg k "$pkg" --arg v "$sha" '. + {($k): $v}')
            assets+=("$zip")
          done
          echo "$manifest" | jq . > "wayland-nano-${VERSION}-shasums.json"
          assets+=("wayland-nano-${VERSION}-shasums.json")
          gh release create "$TAG" --title "Wayland Nano $VERSION" --generate-notes "${assets[@]}" \
            || gh release upload "$TAG" "${assets[@]}" --clobber

      - name: Evidence bundle
        # DEBT: collect-evidence.ps1 is Windows-oriented and fails on the
        # ubuntu publish leg; the gate manifests already carry the evidence.
        # Post-publish bookkeeping — never block a successful publish on it.
        continue-on-error: true
        run: powershell -NoProfile -File scripts/collect-evidence.ps1 -BundleDir artifacts/evidence-bundle -AllowMissing
        shell: pwsh

      - uses: actions/upload-artifact@v4
        with:
          name: release-evidence-bundle
          path: artifacts/evidence-bundle/
