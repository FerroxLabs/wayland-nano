[licenses]
# MPL-2.0 deliberately absent: Grok carries 9 MPL-2.0 packages; add only after
# per-package review when a dependency actually requires it.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[advisories]
ignore = []
