[workspace]
resolver = "2"
members = [
    "crates/nano-activation",
    "crates/nano-core",
    "crates/nano-agent",
    "crates/nano-hooks",
    "crates/nano-checkpoints",
    "crates/nano-model",
    "crates/nano-repomap",
    "crates/nano-tools",
    "crates/nano-platform",
    "crates/nano-sandbox",
    "crates/nano-egress",
    "crates/nano-mcp",
    "crates/nano-skills",
    "crates/nano-session",
    "crates/nano-protocol",
    "crates/nano-cli",
    "crates/nano-plugins",
    "crates/nano-tui",
    "crates/nano-cua",
    "crates/nano-verify",
    "crates/nano-memory",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.85"

[workspace.dependencies]
# P2a §4.7: base64 promoted from nano-sandbox to the workspace table.
base64 = "0.22"
ed25519-dalek = "=3.0.0"
serde_jcs = "=0.2.0"
sha2 = "0.10"
async-trait = "0.1"
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# P2a §4.7/D8: NEW dependency for the hardened image loader. Pinned exact;
# default-features OFF and the decoder feature allowlist is exactly
# {png, jpeg, gif, webp} at the LINK level (SVG/BMP/TIFF and every other
# decoder are excluded by construction). Consumers must use
# `image.workspace = true` and may NOT add features locally — the
# feature-lock test in nano-tools/src/image.rs asserts this manifest.
image = { version = "=0.25.10", default-features = false, features = [
    "png",
    "jpeg",
    "gif",
    "webp",
] }
tar = "=0.4.46"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
