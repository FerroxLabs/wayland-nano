[workspace]
resolver = "2"
members = [
    "crates/nano-core",
    "crates/nano-agent",
    "crates/nano-model",
    "crates/nano-tools",
    "crates/nano-platform",
    "crates/nano-sandbox",
    "crates/nano-egress",
    "crates/nano-mcp",
    "crates/nano-skills",
    "crates/nano-session",
    "crates/nano-protocol",
    "crates/nano-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.85"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
