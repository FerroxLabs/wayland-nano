[package]
name = "nano-sandbox"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
autobins = false

[dependencies]
nano-core = { version = "0.1.0", path = "../nano-core" }
# anyhow/globset/regex-lite are unconditional (not Linux/macOS-only) because
# the unix argv/policy builders compile under `cfg(any(target_os = ..., test))`
# — and under the `unix-argv-builders` feature — so their pure string-building
# tests run on every host.
anyhow = "1"
globset = "0.4"
regex-lite = "0.1.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
# Compiles the pure unix argv/policy builders (seatbelt, landlock, bwrap) on
# non-unix hosts so downstream crates can unit-test their sandbox transform
# wiring in `cargo test` on any platform. The builders are pure string
# construction; runtime spawn paths stay platform-bound.
unix-argv-builders = []

[target.'cfg(target_os = "windows")'.dependencies]
anyhow = "1"
dunce = "1"
# Workspace-promoted in P2a §4.7 (was a local `base64 = "0.22"` pin).
base64.workspace = true
dirs-next = "2"
glob = "0.3"
tempfile = "3"
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_WindowsFirewall",
    "Win32_System_Com",
    "Win32_System_Variant",
] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
rand = { version = "0.8", features = ["std", "small_rng"] }
tracing-appender = "0.2"
thiserror = "2"
tokio = { version = "1", features = ["process", "rt", "sync", "macros", "signal", "time", "io-util"] }
tracing = "0.1"
windows-sys = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_System_Diagnostics_Debug",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Threading",
    "Win32_System_JobObjects",
    "Win32_System_SystemServices",
    "Win32_System_Environment",
    "Win32_System_Pipes",
    "Win32_System_WindowsProgramming",
    "Win32_System_IO",
    "Win32_System_Memory",
    "Win32_System_Kernel",
    "Win32_System_Console",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_NetworkManagement_NetManagement",
    "Win32_NetworkManagement_WindowsFilteringPlatform",
    "Win32_Networking_WinSock",
    "Win32_System_LibraryLoader",
    "Win32_System_Com",
    "Win32_Security_Cryptography",
    "Win32_Security_Authentication_Identity",
    "Win32_System_Rpc",
    "Win32_Graphics_Gdi",
    "Win32_System_StationsAndDesktops",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_System_Registry",
] }

[dev-dependencies]
pretty_assertions = "1"
dunce = "1"
tempfile = "3"

[target.'cfg(target_os = "linux")'.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
landlock = "0.4.4"
libc = "0.2"
seccompiler = "0.5.0"
sha2 = "0.10"

# Helper binaries are platform-bound: the ported Windows sandbox helpers only
# build on Windows, and the legacy Landlock/seccomp enforcement helper only
# builds on Linux. Declaring them under target cfg keeps cross-target
# `cargo check` green without stub mains.
[[bin]]
name = "wayland-nano-sandbox-setup"
path = "src/bin/setup_main/main.rs"

[[bin]]
name = "wayland-nano-command-runner"
path = "src/bin/command_runner/main.rs"

[[bin]]
name = "wayland-nano-provision-dry-run"
path = "src/bin/provision_dry_run/main.rs"

[[bin]]
name = "wayland-nano-tree-kill-probe"
path = "src/bin/tree_kill_probe/main.rs"

[[bin]]
name = "wayland-nano-spawn-profile"
path = "src/bin/spawn_profile/main.rs"

[[bin]]
name = "wayland-nano-linux-sandbox"
path = "src/bin/linux_sandbox/main.rs"
