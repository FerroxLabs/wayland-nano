[package]
name = "nano-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "nanok3"
path = "src/main.rs"

[[bin]]
name = "nanok3-acp-profile"
path = "src/bin/acp_profile/main.rs"

[dependencies]
dirs-next = "2"
nano-agent = { path = "../nano-agent" }
nano-core = { path = "../nano-core" }
nano-egress = { path = "../nano-egress" }
nano-model = { path = "../nano-model" }
nano-protocol = { path = "../nano-protocol" }
nano-sandbox = { path = "../nano-sandbox" }
nano-session = { path = "../nano-session" }
nano-tools = { path = "../nano-tools" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
tokio = { version = "1", features = ["macros", "rt", "sync"] }

[dev-dependencies]
serde_json = "1"
async-trait = "0.1"
nano-agent = { path = "../nano-agent" }
nano-model = { path = "../nano-model" }
