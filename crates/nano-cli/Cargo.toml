[package]
name = "nano-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = []
mem-stats = []

[[bin]]
name = "wayland-nano"
path = "src/main.rs"

[[bin]]
name = "wayland-nano-acp-profile"
path = "src/bin/acp_profile/main.rs"

# C7: the one error-table generator (see nano-protocol/src/error_codes.rs).
[[bin]]
name = "gen_error_table"
path = "src/bin/gen_error_table.rs"

[dependencies]
async-trait = "0.1"
# P2a §5.1/§5.3: attachment blob publish/rehydrate base64 at the ACP host
# boundary (0.22, the in-tree version — nano-sandbox).
base64 = "0.22"
dirs-next = "2"
nano-agent = { version = "0.2.0", path = "../nano-agent" }
nano-activation = { version = "0.2.0", path = "../nano-activation" }
# S7 seam: the checkpoint store is opened at session bootstrap (recovery
# sweep) and shared into the per-turn CheckpointToolExecutor wrap.
nano-checkpoints = { version = "0.2.0", path = "../nano-checkpoints" }
nano-hooks = { version = "0.2.0", path = "../nano-hooks" }
nano-core = { version = "0.2.0", path = "../nano-core" }
# S9: the ACP host constructs the CUA backend/policy (backends::for_platform,
# CuaPolicy::default); the bridge and engine seam live in nano-agent.
nano-cua = { version = "0.2.0", path = "../nano-cua" }
nano-egress = { version = "0.2.0", path = "../nano-egress" }
# F-36 (P3 §6.3): the OAuth record_grant producer converts
# nano-mcp's flow::GrantRecord into the journaled Op::McpOauthGrant.
nano-mcp = { version = "0.2.0", path = "../nano-mcp" }
# 03-02 (D3-04/D3-05): the host MemoryPolicy source parses strict TOML into
# the frozen nano-memory policy/agent types (resolution only — the seam's
# store-open validation and policy journaling are 03-03's).
nano-memory = { version = "0.2.0", path = "../nano-memory" }
nano-model = { version = "0.2.0", path = "../nano-model" }
nano-plugins = { version = "0.2.0", path = "../nano-plugins" }
nano-protocol = { version = "0.2.0", path = "../nano-protocol" }
nano-sandbox = { version = "0.2.0", path = "../nano-sandbox" }
nano-session = { version = "0.2.0", path = "../nano-session" }
nano-tools = { version = "0.2.0", path = "../nano-tools" }
nano-verify = { version = "0.2.0", path = "../nano-verify" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# P5 §7: the candidate snapshot's catalog/proof digest (0.10, the in-tree
# version — nano-session/nano-model).
sha2 = "0.10"
# 03-02: the pinned in-tree TOML parser (0.8 — nano-core/nano-hooks/nano-model)
# for the $NANO_HOME/memory-policy.toml + agents/*.agent.toml sources.
toml = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
tokio = { version = "1", features = ["macros", "rt", "sync"] }

[dev-dependencies]
serde_json = "1"
ed25519-dalek = "2"
serde_jcs = "0.1"
async-trait = "0.1"
nano-agent = { version = "0.2.0", path = "../nano-agent" }
nano-model = { version = "0.2.0", path = "../nano-model" }
tempfile = "3"

# P4 §3.3: the hardened review-diff git invocation kills the child's
# process GROUP on timeout (process_group(0) + SIGKILL) — the same libc
# pin nano-tools/nano-sandbox carry.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# P4 §3.3: the Windows half spawns git suspended (CREATE_SUSPENDED) and
# assigns it to the nano-sandbox Job Object before resume. windows-sys
# stays on the workspace-pinned 0.52.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = ["Win32_System_ProcessStatus", "Win32_System_Threading"] }
