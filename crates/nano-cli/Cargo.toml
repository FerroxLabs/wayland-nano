[package]
name = "nano-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "wayland-nano"
path = "src/main.rs"

[[bin]]
name = "wayland-nano-acp-profile"
path = "src/bin/acp_profile/main.rs"

# C7: the one error-table generator (see nano-protocol/src/error_codes.rs).
[[bin]]
name = "gen_error_table"
path = "src/bin/gen_error_table.rs"

[dependencies]
dirs-next = "2"
nano-agent = { version = "0.1.0", path = "../nano-agent" }
nano-core = { version = "0.1.0", path = "../nano-core" }
nano-egress = { version = "0.1.0", path = "../nano-egress" }
nano-model = { version = "0.1.0", path = "../nano-model" }
nano-protocol = { version = "0.1.0", path = "../nano-protocol" }
nano-sandbox = { version = "0.1.0", path = "../nano-sandbox" }
nano-session = { version = "0.1.0", path = "../nano-session" }
nano-tools = { version = "0.1.0", path = "../nano-tools" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
tokio = { version = "1", features = ["macros", "rt", "sync"] }

[dev-dependencies]
serde_json = "1"
async-trait = "0.1"
nano-agent = { version = "0.1.0", path = "../nano-agent" }
nano-model = { version = "0.1.0", path = "../nano-model" }
