[package]
name = "nano-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "wayland-nano"
path = "src/main.rs"

[[bin]]
name = "wayland-nano-acp-profile"
path = "src/bin/acp_profile/main.rs"

# C7: the one error-table generator (see nano-protocol/src/error_codes.rs).
[[bin]]
name = "gen_error_table"
path = "src/bin/gen_error_table.rs"

[dependencies]
async-trait = "0.1"
# P2a §5.1/§5.3: attachment blob publish/rehydrate base64 at the ACP host
# boundary (0.22, the in-tree version — nano-sandbox).
base64 = "0.22"
dirs-next = "2"
nano-agent = { version = "0.1.0", path = "../nano-agent" }
nano-hooks = { version = "0.1.0", path = "../nano-hooks" }
nano-core = { version = "0.1.0", path = "../nano-core" }
nano-egress = { version = "0.1.0", path = "../nano-egress" }
# F-36 (P3 §6.3): the OAuth record_grant producer converts
# nano-mcp's flow::GrantRecord into the journaled Op::McpOauthGrant.
nano-mcp = { version = "0.1.0", path = "../nano-mcp" }
nano-model = { version = "0.1.0", path = "../nano-model" }
nano-protocol = { version = "0.1.0", path = "../nano-protocol" }
nano-sandbox = { version = "0.1.0", path = "../nano-sandbox" }
nano-session = { version = "0.1.0", path = "../nano-session" }
nano-tools = { version = "0.1.0", path = "../nano-tools" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# P5 §7: the candidate snapshot's catalog/proof digest (0.10, the in-tree
# version — nano-session/nano-model).
sha2 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
tokio = { version = "1", features = ["macros", "rt", "sync"] }

[dev-dependencies]
serde_json = "1"
async-trait = "0.1"
nano-agent = { version = "0.1.0", path = "../nano-agent" }
nano-model = { version = "0.1.0", path = "../nano-model" }
tempfile = "3"

# P4 §3.3: the hardened review-diff git invocation kills the child's
# process GROUP on timeout (process_group(0) + SIGKILL) — the same libc
# pin nano-tools/nano-sandbox carry.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# P4 §3.3: the Windows half spawns git suspended (CREATE_SUSPENDED) and
# assigns it to the nano-sandbox Job Object before resume. windows-sys
# stays on the workspace-pinned 0.52.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = ["Win32_System_Threading"] }
