[package]
name = "nano-agent"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = []
# S10-only scripted driver. Packaged artifacts never enable this feature.
soak-fake-model = []

[dependencies]
nano-core = { version = "0.1.0", path = "../nano-core" }
nano-hooks = { version = "0.1.0", path = "../nano-hooks" }
nano-checkpoints = { version = "0.1.0", path = "../nano-checkpoints" }
nano-skills = { version = "0.1.0", path = "../nano-skills" }
nano-mcp = { version = "0.1.0", path = "../nano-mcp" }
nano-tools = { version = "0.1.0", path = "../nano-tools" }
# C7: kind_of_egress maps the (redacted-by-construction) egress variants.
nano-egress = { version = "0.1.0", path = "../nano-egress" }
async-trait = "0.1"
chrono = { version = "0.4", default-features = false, features = ["std"] }
nano-model = { version = "0.1.0", path = "../nano-model" }
nano-session = { version = "0.1.0", path = "../nano-session" }
# S9: the CUA dispatch seam (backends, policy, op vocabulary). nano-cua links
# no HTTP client by construction (design §2.6) — this dep adds no egress.
nano-cua = { version = "0.1.0", path = "../nano-cua" }
# S9: screenshot results arrive base64 from the backends (CuaOpResult shape).
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
rand = "0.8"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt", "time", "sync"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
nano-egress = { version = "0.1.0", path = "../nano-egress" }
futures-util = "0.3"
tempfile = "3"
pretty_assertions = "1"
