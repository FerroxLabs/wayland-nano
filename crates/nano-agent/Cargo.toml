[package]
name = "nano-agent"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
nano-skills = { path = "../nano-skills" }
nano-mcp = { path = "../nano-mcp" }
nano-tools = { path = "../nano-tools" }
async-trait = "0.1"
nano-model = { path = "../nano-model" }
nano-session = { path = "../nano-session" }
tokio = { version = "1", features = ["macros", "rt", "time"] }
serde_json = "1"

[dev-dependencies]
nano-core = { path = "../nano-core" }
nano-egress = { path = "../nano-egress" }
tempfile = "3"
pretty_assertions = "1"
