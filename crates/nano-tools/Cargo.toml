[package]
name = "nano-tools"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
nano-sandbox = { path = "../nano-sandbox" }
dunce = "1"
globset = "0.4"
regex = "1"
nano-core = { path = "../nano-core" }
thiserror = "2"

[dev-dependencies]
# Feature-unify the pure unix argv/policy builders into test builds so the
# shell transform wiring is unit-tested on every host (they are pure string
# construction; runtime spawn paths stay platform-bound).
nano-sandbox = { path = "../nano-sandbox", features = ["unix-argv-builders"] }
pretty_assertions = "1"
tempfile = "3"
