[package]
name = "nano-tools"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
nano-sandbox = { version = "0.1.0", path = "../nano-sandbox" }
dunce = "1"
globset = "0.4"
regex = "1"
nano-core = { version = "0.1.0", path = "../nano-core" }
nano-repomap = { version = "0.1.0", path = "../nano-repomap" }
nano-egress = { version = "0.1.0", path = "../nano-egress" }
nano-model = { version = "0.1.0", path = "../nano-model" }
# nano-session supplies NanoErrorKind (the typed journal vocabulary) for the
# P2a image loader's typed rejections. No cycle: nano-session has no
# nano-* dependencies.
nano-session = { version = "0.1.0", path = "../nano-session" }
async-trait = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde_json = "1"
thiserror = "2"
# P2a §4.7/D8: pinned at the workspace table with the link-level decoder
# allowlist {png, jpeg, gif, webp} — do NOT enable further features here
# (the feature-lock test in src/image.rs fails CI if that drifts).
image.workspace = true
# sha2 0.10, same major as the rest of the tree (§4.7): the loader's §4.6
# digest is the blob store's content address.
sha2 = "0.10"
# spawn_blocking + the 1-permit decode semaphore (§4.2 sequential decode,
# §4.3 panic containment).
tokio = { version = "1", features = ["rt", "sync"] }

[target.'cfg(unix)'.dependencies]
# Process-group kill for the C6 task kill domain (run_task).
libc = "0.2"

[dev-dependencies]
# Feature-unify the pure unix argv/policy builders into test builds so the
# shell transform wiring is unit-tested on every host (they are pure string
# construction; runtime spawn paths stay platform-bound).
nano-sandbox = { version = "0.1.0", path = "../nano-sandbox", features = ["unix-argv-builders"] }
pretty_assertions = "1"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt", "time"] }
