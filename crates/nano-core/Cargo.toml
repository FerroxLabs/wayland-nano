[package]
name = "nano-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
dirs-next = "2"
dunce = "1"
globset = "0.4"
serde = { version = "1", features = ["derive"] }
tracing = "0.1"
serde_json = "1"
toml = "0.8"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# Pinned workspace version (0.52, per AGENTS.md). Win32_Storage_FileSystem /
# Win32_System_IO serve the hard-link alias write check and the rules-file
# sidecar lock; Win32_Security*/Win32_System_Threading serve the rules-file
# owner-only DACL audit + ACL pin (the P2a §5.5 helper ported in-module).
windows-sys = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Threading",
] }

[dev-dependencies]
pretty_assertions = "1"
tempfile = "3"
