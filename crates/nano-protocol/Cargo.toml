[package]
name = "nano-protocol"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
nano-agent = { version = "0.1.0", path = "../nano-agent" }
nano-model = { version = "0.1.0", path = "../nano-model" }
# P2a §2.3 (LANE-A BOUNDARY): the ACP prompt-block converter drives the §4
# hardened loader (nano_tools::image) at intake.
nano-tools = { version = "0.1.0", path = "../nano-tools" }
# C7: NanoErrorKind (the journaled error vocabulary) — serde-only crate,
# no cycle (nano-session depends on nothing in this workspace).
nano-session = { version = "0.1.0", path = "../nano-session" }
# P2a §2.3: ACP image-block base64 decode/encode at the converter boundary
# (0.22, the in-tree version — nano-sandbox).
base64 = "0.22"
# P2a §3.3: the image_path confinement allowlist includes the OS user
# pictures dir.
dirs-next = "2"
tokio = { version = "1", features = ["macros", "rt"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[target.'cfg(unix)'.dependencies]
# P2a audit H-2: O_NOFOLLOW for the confined image_path open.
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# P2a audit H-2: the reparse-safe CreateFileW + handle final-path
# verification for the confined image_path open (the nano-session
# attachment-store pattern; windows-sys stays pinned at 0.52).
windows-sys = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
] }

[dev-dependencies]
pretty_assertions = "1"
nano-egress = { version = "0.1.0", path = "../nano-egress" }
