[package]
name = "nano-tui"
version.workspace = true
edition.workspace = true
license.workspace = true
# ratatui 0.30 requires 1.88; the workspace floor is 1.85. The pinned
# toolchain (1.95.0) is unaffected — this only raises the declared MSRV
# for this crate (design doc §3).
rust-version = "1.88"

[[bin]]
name = "nano-tui"
path = "src/main.rs"

# Test-support binary: a scripted fake acp-host speaking NDJSON over
# stdio. Used by the L3 PTY smoke (tests/pty.rs); not shipped runtime.
[[bin]]
name = "nano-tui-fake-host"
path = "src/bin/fake_host_main.rs"

[dependencies]
# The ONLY new external production deps (design doc §2, objection D1 —
# pinned). tokio/serde/serde_json are already in the workspace closure.
ratatui = { version = "=0.30.2", default-features = false, features = [
    "crossterm",
    "layout-cache",
] }
crossterm = { version = "=0.29.0", features = ["bracketed-paste", "event-stream"] }
tokio = { version = "1", features = ["macros", "rt", "sync", "io-util", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
# Workspace pin — do not bump (AGENTS.md).
windows-sys = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_System_Console",
] }

[dev-dependencies]
# Test-only (design doc §2 dep table).
vt100 = "0.16.2"
insta = { version = "1", features = ["filters"] }
portable-pty = "0.9"
