[package]
name = "nano-plugins"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
flate2 = "1"
nano-agent = { version = "0.2.0", path = "../nano-agent" }
nano-egress = { version = "0.2.0", path = "../nano-egress" }
nano-session = { version = "0.2.0", path = "../nano-session" }
reqwest = { version = "0.12", default-features = false, features = ["stream", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar.workspace = true
thiserror = "2"
tokio = { version = "1", features = ["rt", "time"] }

[dev-dependencies]
tempfile = "3"
